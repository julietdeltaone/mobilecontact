<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay in Touch — JD Meyers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000000;--text:#ffffff;--muted:rgba(255,255,255,.64);--faint:rgba(255,255,255,.40);--line:rgba(255,255,255,.26);--field:rgba(255,255,255,.06);--accent:#E30613}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--text:#000000;--muted:rgba(0,0,0,.62);--faint:rgba(0,0,0,.42);--line:rgba(0,0,0,.24);--field:rgba(0,0,0,.04)}}
body{font-family:"Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:40px 22px 48px}
h1{font-size:40px;font-weight:700;letter-spacing:.01em;line-height:1.05;text-transform:uppercase}
.rule{height:1px;background:var(--line);margin:24px 0 2px}
label.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:24px 0 9px}
label.flabel .opt{color:var(--faint);letter-spacing:.08em}
input[type=text],input[type=tel]{width:100%;font-family:inherit;font-size:18px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:15px 16px;min-height:58px;outline:none}
input:focus{border-color:var(--accent)}
button.submit{width:100%;margin-top:34px;font-family:inherit;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:17px;background:var(--accent);border:1px solid var(--accent);color:#ffffff;border-radius:3px;min-height:62px;cursor:pointer}
button.submit:active{transform:scale(.99)}
button.submit[disabled]{opacity:.55}
.err{display:none;margin-top:16px;font-size:15px;color:var(--accent);font-weight:600;line-height:1.45}
#done{display:none}
#done .big{font-size:38px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.hp{position:absolute;left:-9999px;top:-9999px;height:0;width:0;opacity:0}
</style>
</head>
<body>
<div class="wrap">

  <form id="dropform" method="POST" action="https://formsubmit.co/johndavidmeyers@gmail.com" target="drop_sink" novalidate>
    <h1>Stay in Touch</h1>
    <div class="rule"></div>

    <input type="text" id="honey" name="_honey" class="hp" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://julietdeltaone.github.io/mobilecontact/share.html">
    <input type="hidden" name="_subject" id="subjectfield" value="Contact drop">

    <label class="flabel" for="first_name">First name</label>
    <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>

    <label class="flabel" for="last_name">Last name <span class="opt">(optional)</span></label>
    <input type="text" id="last_name" name="last_name" autocomplete="family-name">

    <label class="flabel" for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required>

    <label class="flabel" for="note">Optional notes</label>
    <input type="text" id="note" name="note" autocomplete="off">

    <button type="submit" class="submit" id="submitbtn">Send</button>
    <div class="err" id="err"></div>
  </form>
  <iframe name="drop_sink" id="drop_sink" style="display:none" aria-hidden="true"></iframe>

  <div id="done">
    <div class="big">Got it.</div>
  </div>

</div>
<script>
(function(){
  var form=document.getElementById('dropform');
  var err=document.getElementById('err');
  var btn=document.getElementById('submitbtn');
  var sink=document.getElementById('drop_sink');
  var armed=false, timer=null;
  function val(id){return document.getElementById(id).value.trim();}
  function fail(msg){
    armed=false;
    if(timer){clearTimeout(timer);timer=null;}
    btn.disabled=false;
    btn.textContent='Send';
    err.textContent=msg;
    err.style.display='block';
  }
  sink.addEventListener('load',function(){
    if(!armed){return;}
    armed=false;
    if(timer){clearTimeout(timer);timer=null;}
    form.style.display='none';
    document.getElementById('done').style.display='block';
    window.scrollTo(0,0);
  });
  form.addEventListener('submit',function(e){
    err.style.display='none';
    var first=val('first_name');
    if(!first){
      e.preventDefault();
      err.textContent='First name is required.';
      err.style.display='block';
      document.getElementById('first_name').focus();
      return;
    }
    var phone=val('phone');
    if(!phone){
      e.preventDefault();
      err.textContent='Phone is required.';
      err.style.display='block';
      document.getElementById('phone').focus();
      return;
    }
    document.getElementById('subjectfield').value='Contact drop — '+first;
    btn.disabled=true;
    btn.textContent='Sending…';
    armed=true;
    timer=setTimeout(function(){fail('That did not go through. Check your connection and try once more.');},12000);
  });
})();
</script>
</body>
</html>
