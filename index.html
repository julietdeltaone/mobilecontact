<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD Meyers</title>
<script>(function(){var t='dark';try{if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){t='light';}}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.theme-toggle{position:fixed;top:22px;right:26px;z-index:60;font-size:19px;font-weight:600;letter-spacing:.02em;padding:14px 26px;border-radius:999px}
.qr-tile{background:#ffffff;border-radius:24px;padding:26px;line-height:0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.qr-tile svg{width:100%;height:auto;display:block}
.panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.22,.8,.28,1),opacity .4s ease}
.panel.open{opacity:1}
.panel-inner{display:flex;flex-direction:column;align-items:center;justify-content:center}
.handle{font-weight:600;letter-spacing:.01em}
.phone-number{text-decoration:none;font-weight:700;letter-spacing:.045em;white-space:nowrap}

:root[data-theme="dark"]{--text:#f6f7fb;--glass:rgba(255,255,255,.08);--glass-line:rgba(255,255,255,.22);--btn:rgba(255,255,255,.07);--btn-line:rgba(255,255,255,.18);--btn-active:#f6f7fb;--btn-active-text:#101322;--toggle:rgba(255,255,255,.1);--toggle-line:rgba(255,255,255,.25);--bg-grad:radial-gradient(1200px 800px at 18% 8%,#2b3350 0%,transparent 55%),radial-gradient(1100px 760px at 85% 90%,#3a2b52 0%,transparent 55%),linear-gradient(150deg,#0a0d18 0%,#131828 52%,#0a0c14 100%)}
:root[data-theme="light"]{--text:#141824;--glass:rgba(255,255,255,.55);--glass-line:rgba(20,24,36,.14);--btn:rgba(255,255,255,.45);--btn-line:rgba(20,24,36,.14);--btn-active:#141824;--btn-active-text:#ffffff;--toggle:rgba(255,255,255,.6);--toggle-line:rgba(20,24,36,.16);--bg-grad:radial-gradient(1200px 800px at 18% 8%,#cdd8f2 0%,transparent 55%),radial-gradient(1100px 760px at 85% 90%,#e3d5f2 0%,transparent 55%),linear-gradient(150deg,#eef1f7 0%,#e2e7f2 52%,#edf0f7 100%)}
body{background-color:#0a0d18;color:var(--text);display:flex;min-height:100vh;padding:36px}
:root[data-theme="light"] body{background-color:#eef1f7}
.theme-toggle{background:var(--toggle);color:var(--text);border:1px solid var(--toggle-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{margin:auto;width:min(900px,94vw);background:var(--glass);border:1px solid var(--glass-line);border-radius:30px;padding:54px 56px 46px;text-align:center;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.name{font-size:64px;font-weight:700;letter-spacing:-.01em;margin-bottom:40px}
.choices{display:flex;flex-direction:column;gap:16px}
.choice{min-height:96px;border:1px solid var(--btn-line);background:var(--btn);color:var(--text);border-radius:18px;font-size:32px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s ease,color .25s ease}
.choice.active{background:var(--btn-active);color:var(--btn-active-text)}
.panel.open{max-height:900px}
.panel-inner{padding:38px 0 12px}
.qr-tile{width:min(460px,72vw)}
.handle{font-size:34px;margin-top:26px}
.phone-number{font-size:min(96px,11.5vw);color:var(--text);padding:26px 0}

body::before{content:"";position:fixed;inset:-14%;background:var(--bg-grad);z-index:-1;animation:bgdrift 60s ease-in-out infinite alternate;will-change:transform,filter}
@keyframes bgdrift{from{transform:translate3d(-1.6%,-1.2%,0) scale(1.02);filter:hue-rotate(-5deg)}to{transform:translate3d(1.6%,1.2%,0) scale(1.05);filter:hue-rotate(5deg)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
:root[data-theme="light"] .card{border-color:rgba(20,24,36,.30);box-shadow:0 30px 80px rgba(20,24,36,.30),0 6px 20px rgba(20,24,36,.14)}
.name{transition:font-size .45s cubic-bezier(.22,.8,.28,1),margin-bottom .45s cubic-bezier(.22,.8,.28,1)}
body.has-open .name{font-size:34px;margin-bottom:20px}
.qr-tile{transition:width .5s cubic-bezier(.22,.8,.28,1)}
.panel.open .qr-tile{width:min(600px,78vw)}
.phone-number{transition:font-size .45s cubic-bezier(.22,.8,.28,1)}
.panel.open .phone-number{font-size:min(116px,13vw)}
</style>
</head>

<script>
(function(){
  var root=document.documentElement;
  function setTheme(t){root.setAttribute('data-theme',t);var b=document.querySelector('.theme-toggle');if(b){b.textContent=(t==='dark')?'Light':'Dark';}}
  setTheme(root.getAttribute('data-theme')||'dark');
  var tt=document.querySelector('.theme-toggle');
  if(tt){tt.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');});}
  var btns=document.querySelectorAll('[data-panel]');
  var panels={};
  document.querySelectorAll('.panel').forEach(function(p){panels[p.id]=p;});
  var resetTimer=null;
  function clearReset(){if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}}
  function armReset(){clearReset();resetTimer=setTimeout(function(){closeAll(null);},30000);}
  function closeAll(except){
    btns.forEach(function(b){var on=b.getAttribute('data-panel')===except;b.classList.toggle('active',on);b.setAttribute('aria-expanded',on?'true':'false');});
    Object.keys(panels).forEach(function(id){panels[id].classList.toggle('open',id===except);});
    document.body.classList.toggle('has-open',!!except);
    if(except){armReset();}else{clearReset();}
  }
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-panel');
      var isOpen=panels[id]&&panels[id].classList.contains('open');
      closeAll(isOpen?null:id);
    });
  });
  document.addEventListener('pointerdown',function(){if(document.body.classList.contains('has-open')){armReset();}});
  var card=document.querySelector('.card');
  if(card){card.addEventListener('click',function(e){
    if(!document.body.classList.contains('has-open')){return;}
    if(e.target.closest('.choice')){return;}
    closeAll(null);
  });}
  var done=document.querySelector('.done-btn');
  if(done){done.addEventListener('click',function(){closeAll(null);});}
})();
</script>
